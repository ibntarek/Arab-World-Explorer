<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1F6FBF">
<title>رحلة المستكشف في خريطة الوطن العربي</title>
<link rel="icon" href="assets/images/compass.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Shared SVG shapes (country geometry) – filled by game.js from js/map-data.js -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="mapdefs"></defs></svg>

<div id="app">

  <!-- ============ TOP BAR ============ -->
  <header id="topbar">
    <button id="brand" type="button" aria-label="الشاشة الرئيسية">
      <img src="assets/images/compass.png" alt=""><span>رحلة المستكشف</span>
    </button>
    <nav id="stepper" aria-label="مشاهد اللعبة"></nav>
    <div class="tools">
      <div class="pill" title="مجموع نقاطك">⭐ <span id="score">٠</span></div>
      <button class="tb-btn" id="btnNotebook" type="button" title="دفتر المستكشف" aria-label="دفتر المستكشف">📒</button>
      <button class="tb-btn" id="btnRestart" type="button" title="إعادة هذا النشاط" aria-label="إعادة النشاط">↻</button>
      <div class="vol">
        <button class="tb-btn" id="btnSound" type="button" title="تشغيل / إيقاف الصوت" aria-label="الصوت">🔊</button>
        <input id="vol" type="range" min="0" max="100" step="5" value="70" aria-label="مستوى الصوت">
      </div>
    </div>
  </header>

  <main id="stage">

    <!-- ============ SCENE 1 : WELCOME ============ -->
    <section class="scene" id="scene1">
      <div class="bunting" id="bunting" aria-hidden="true"></div>
      <div class="welcome">
        <div class="txt">
          <p class="title-en">Arab World Map Explorer</p>
          <h1 class="title-ar">رحلة المستكشف<em>في خريطة الوطن العربي</em></h1>
          <p class="welcome-msg">أهلاً بك أيها المستكشف الصغير! 🧭<br>سننطلق معاً في رحلة على خريطة الوطن العربي، لنتعرّف على الدول العربية والمسطحات المائية المجاورة لها.</p>
          <div class="welcome-actions">
            <button class="btn big glow" id="btnStart" type="button">ابدأ الرحلة 🚀</button>
            <button class="btn light" id="btnContinue" type="button" hidden>متابعة رحلتي</button>
          </div>
          <div class="league-badge"><img src="assets/flags/arableague.svg" alt=""><span>٢٢ دولة عربية في انتظارك</span></div>
        </div>
        <div class="art">
          <img class="globe" src="assets/images/globe.png" alt="كرة أرضية مستكشفة">
          <img class="boy" src="assets/images/boy_jump.png" alt="مستكشف صغير سعيد">
        </div>
      </div>
    </section>

    <!-- ============ SCENES 2-6 (content built by game.js) ============ -->
    <section class="scene scene-sky" id="scene2"><div class="game-grid"><div class="map-slot" id="slot2"></div><aside class="panel" id="panel2"></aside></div></section>
    <section class="scene scene-sky" id="scene3"><div class="game-grid"><div class="map-slot" id="slot3"></div><aside class="panel" id="panel3"></aside></div></section>
    <section class="scene scene-sky" id="scene4"><div class="game-grid"><div class="map-slot" id="slot4"></div><aside class="panel" id="panel4"></aside></div></section>
    <section class="scene scene-sky" id="scene5"><div class="game-grid"><div class="map-slot" id="slot5"></div><aside class="panel" id="panel5"></aside></div></section>
    <section class="scene scene-sky" id="scene6"><div class="game-grid"><div class="map-slot" id="slot6"></div><aside class="panel" id="panel6"></aside></div></section>

  </main>
</div>

<!-- Explorer's notebook (progress + review of mistakes) -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card" id="modalCard"></div>
</div>

<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/map-data.js"></script>
<script src="js/map-view.js"></script>
<script src="js/game.js"></script>
</body>
</html>
